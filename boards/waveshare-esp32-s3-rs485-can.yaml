# Waveshare ESP32-S3-RS485-CAN.
# 16MB flash, 8MB PSRAM, 7-36V screw terminal, WiFi only.
# CAN on GPIO15 (TX) and GPIO16 (RX), isolated, with a 120R jumper.
#
# CHECK THE PINS. GPIO15/GPIO16 come from secondary sources, not from Waveshare
# directly, because waveshare.com blocks automated fetches. They have not been
# confirmed against the official Waveshare wiki. Do that before you flash. If
# they are wrong the symptom is no frames at all, not an error.
#
# Termination: set the jumper to 120R only if this board replaced a
# terminator or sits at a physical end of the bus. See the README.
#
# This file deliberately does not configure WiFi. Credentials are yours.
substitutions:
  can_tx_pin: GPIO15
  can_rx_pin: GPIO16

esp32:
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: arduino
