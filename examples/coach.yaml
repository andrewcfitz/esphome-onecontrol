# A complete coach: eight lights, five tanks, water pump, tank heater and
# battery voltage, on a Waveshare ESP32-S3-ETH-8DI-8RO-C.
#
# THE IDENTITIES BELOW ARE ONE SPECIFIC COACH'S. Function names travel better
# than addresses ever did, but check every one: add discover.yaml to the files
# list, flash, read the log, and use its dev_func / dev_inst values.
#
# There are no awning or slide controls here, and that is deliberate. See
# the README section "Why there are no motor controls".
esphome:
  name: rv-canbus
  friendly_name: RV

logger:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome

packages:
  onecontrol:
    url: https://github.com/andrewcfitz/esphome-onecontrol
    ref: v2.0
    files:
      - boards/waveshare-esp32-s3-eth-8di-8ro-c.yaml
      - core.yaml
      - battery.yaml

      # Uncomment to find your own dev_func / dev_inst values, then comment it out again.
      # - discover.yaml

      # ---- Lights ------------------------------------------------------
      - path: devices/dimmable_light.yaml
        vars: {dev_id: awning_1, dev_name: Awning 1, dev_func: 49, dev_inst: 1, dev_icon: "mdi:awning-outline"}
      - path: devices/dimmable_light.yaml
        vars: {dev_id: awning_2, dev_name: Awning 2, dev_func: 49, dev_inst: 2, dev_icon: "mdi:awning-outline"}
      - path: devices/dimmable_light.yaml
        vars: {dev_id: pendants, dev_name: Kitchen Pendants, dev_func: 34, dev_inst: 0, dev_icon: "mdi:ceiling-light"}
      # Soffit is DIMMABLE_LIGHT on the bus and its fixture strobes if you
      # dim it, so it gets an on/off entity that still speaks the dimmable
      # command form. The driver dims; the fixture does not.
      - path: devices/dimmable_light_switched.yaml
        vars: {dev_id: soffit, dev_name: Soffit, dev_func: 366, dev_inst: 0, dev_icon: "mdi:light-flood-down"}
      - path: devices/relay_light.yaml
        vars: {dev_id: hutch, dev_name: Hutch, dev_func: FILL_ME, dev_inst: FILL_ME, dev_icon: "mdi:cupboard-outline"}
      - path: devices/relay_light.yaml
        vars: {dev_id: island, dev_name: Island Toe Kick, dev_func: FILL_ME, dev_inst: FILL_ME, dev_icon: "mdi:led-strip"}
      - path: devices/relay_light.yaml
        vars: {dev_id: scare, dev_name: Scare, dev_func: FILL_ME, dev_inst: FILL_ME, dev_icon: "mdi:car-light-high"}
      - path: devices/relay_light.yaml
        vars: {dev_id: underbody, dev_name: Underbody Accent, dev_func: FILL_ME, dev_inst: FILL_ME, dev_icon: "mdi:led-strip-variant"}

      # ---- Switches ----------------------------------------------------
      - path: devices/relay_switch.yaml
        vars: {dev_id: water_pump, dev_name: Water Pump, dev_func: 5, dev_inst: 0, dev_icon: "mdi:water-pump", dev_class: running}
      - path: devices/relay_switch.yaml
        vars: {dev_id: tank_heater, dev_name: Tank Heater, dev_func: 270, dev_inst: 0, dev_icon: "mdi:heating-coil", dev_class: heat}

      # ---- Tanks -------------------------------------------------------
      # Names come from each sensor's own DEVICE_ID broadcast, so they are
      # the RV's labels rather than mine. The three greys differ only by
      # function instance, which is all the bus reveals; which physical tank
      # is which needs a look underneath, or filling one and watching.
      - path: devices/tank.yaml
        vars: {dev_id: tank_fresh, dev_name: Fresh Tank, dev_func: 67, dev_inst: 0, dev_icon: "mdi:cup-water"}
      - path: devices/tank.yaml
        vars: {dev_id: tank_grey_1, dev_name: Grey Tank 1, dev_func: 68, dev_inst: FILL_ME, dev_icon: "mdi:dishwasher"}
      - path: devices/tank.yaml
        vars: {dev_id: tank_grey_2, dev_name: Grey Tank 2, dev_func: 68, dev_inst: FILL_ME, dev_icon: "mdi:dishwasher"}
      - path: devices/tank.yaml
        vars: {dev_id: tank_grey_3, dev_name: Grey Tank 3, dev_func: 68, dev_inst: FILL_ME, dev_icon: "mdi:dishwasher"}
      - path: devices/tank.yaml
        vars: {dev_id: tank_black, dev_name: Black Tank, dev_func: 69, dev_inst: 0, dev_icon: "mdi:toilet"}
