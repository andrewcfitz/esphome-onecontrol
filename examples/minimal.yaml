# The smallest thing that works: one board, WiFi, and enough to find out
# what is on your bus.
#
# Flash this as-is first. Watch the log for lines tagged oc.discover, which
# name every device on your coach and give you its dev_func and dev_inst. Then fill in the
# devices you want below, comment out discover.yaml, and flash again.
esphome:
  name: rv-canbus
  friendly_name: RV

logger:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome

packages:
  onecontrol:
    url: https://github.com/andrewcfitz/esphome-onecontrol
    ref: v2.0
    files:
      - boards/waveshare-esp32-s3-rs485-can.yaml
      - core.yaml
      - discover.yaml

      # Replace these with your own, from the oc.discover log lines.
      # - path: devices/relay_switch.yaml
      #   vars: {dev_id: water_pump, dev_name: Water Pump, dev_func: 5, dev_inst: 0, dev_icon: "mdi:water-pump"}
      # - path: devices/tank.yaml
      #   vars: {dev_id: tank_fresh, dev_name: Fresh Tank, dev_func: 67, dev_inst: 0, dev_icon: "mdi:cup-water"}
