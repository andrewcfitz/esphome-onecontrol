# Compile harness for examples/coach.yaml. Not an example, not for flashing.
# Same coach, included by local path instead of the url: form, so it can be
# compiled before the repo is pushed and tagged. api: and ota: are dropped
# since no secrets are available here.
esphome:
  name: t-coach

logger:

packages:
  board: !include ../boards/waveshare-esp32-s3-eth-8di-8ro-c.yaml
  core: !include ../core.yaml
  battery: !include ../battery.yaml

  # ---- Lights ------------------------------------------------------
  awning_1: !include
    file: ../devices/dimmable_light.yaml
    vars: {dev_id: awning_1, dev_name: Awning 1, dev_addr: "0x3F", dev_icon: "mdi:awning-outline"}
  awning_2: !include
    file: ../devices/dimmable_light.yaml
    vars: {dev_id: awning_2, dev_name: Awning 2, dev_addr: "0x62", dev_icon: "mdi:awning-outline"}
  pendants: !include
    file: ../devices/dimmable_light.yaml
    vars: {dev_id: pendants, dev_name: Kitchen Pendants, dev_addr: "0x95", dev_icon: "mdi:ceiling-light"}
  soffit: !include
    file: ../devices/relay_light.yaml
    vars: {dev_id: soffit, dev_name: Soffit, dev_addr: "0xBC", dev_icon: "mdi:light-flood-down"}
  hutch: !include
    file: ../devices/relay_light.yaml
    vars: {dev_id: hutch, dev_name: Hutch, dev_addr: "0x0A", dev_icon: "mdi:cupboard-outline"}
  island: !include
    file: ../devices/relay_light.yaml
    vars: {dev_id: island, dev_name: Island Toe Kick, dev_addr: "0xFB", dev_icon: "mdi:led-strip"}
  scare: !include
    file: ../devices/relay_light.yaml
    vars: {dev_id: scare, dev_name: Scare, dev_addr: "0xF4", dev_icon: "mdi:car-light-high"}
  underbody: !include
    file: ../devices/relay_light.yaml
    vars: {dev_id: underbody, dev_name: Underbody Accent, dev_addr: "0x73", dev_icon: "mdi:led-strip-variant"}

  # ---- Switches ----------------------------------------------------
  water_pump: !include
    file: ../devices/relay_switch.yaml
    vars: {dev_id: water_pump, dev_name: Water Pump, dev_addr: "0x21", dev_icon: "mdi:water-pump", dev_class: running}
  tank_heater: !include
    file: ../devices/relay_switch.yaml
    vars: {dev_id: tank_heater, dev_name: Tank Heater, dev_addr: "0xF2", dev_icon: "mdi:heating-coil", dev_class: heat}

  # ---- Tanks -------------------------------------------------------
  tank_fresh: !include
    file: ../devices/tank.yaml
    vars: {dev_id: tank_fresh, dev_name: Fresh Tank, dev_addr: "0xEC", dev_icon: "mdi:cup-water"}
  tank_grey_1: !include
    file: ../devices/tank.yaml
    vars: {dev_id: tank_grey_1, dev_name: Grey Tank 1, dev_addr: "0xFA", dev_icon: "mdi:dishwasher"}
  tank_grey_2: !include
    file: ../devices/tank.yaml
    vars: {dev_id: tank_grey_2, dev_name: Grey Tank 2, dev_addr: "0x31", dev_icon: "mdi:dishwasher"}
  tank_grey_3: !include
    file: ../devices/tank.yaml
    vars: {dev_id: tank_grey_3, dev_name: Grey Tank 3, dev_addr: "0x23", dev_icon: "mdi:dishwasher"}
  tank_black: !include
    file: ../devices/tank.yaml
    vars: {dev_id: tank_black, dev_name: Black Tank, dev_addr: "0xCD", dev_icon: "mdi:toilet"}
