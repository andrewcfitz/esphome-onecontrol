# Find out what is on your bus. Include this, flash, watch the log, then
# remove it.
#
# Every node broadcasts its identity on 0x200|addr, nominally once a second
# and in practice anywhere up to every 18s:
#   [0..1] product id   [2] product instance
#   [3]    DEVICE_TYPE  [4..5] FUNCTION_NAME
#   [6]    device instance << 4 | function instance
#   [7]    capabilities
#
# Logged once per node per minute rather than on every broadcast, because 36
# devices at 1 Hz is a firehose. Once a minute, not once ever, so that
# `esphome logs` started after boot still sees the whole inventory. THIS IS HOW YOU FIND YOUR dev_func AND dev_inst VALUES. The
# addresses it prints are for reading the log only: a power cut reassigns them.
#
# The lookup tables below cost a couple of KB of flash, which is why this is
# a separate opt-in file rather than part of core.yaml.
#
# It reports everything, including motors this project cannot drive. That is
# deliberate: knowing what your slides announce themselves as is how you know
# what to leave alone.
canbus:
  - id: !extend can_bus
    on_frame:
      - can_id: 0x200
        can_id_mask: 0x700
        use_extended_id: false
        then:
          - lambda: |-
              if (x.size() < 7) return;
              // Logged again if an address starts announcing something else,
              // which is what a reshuffle looks like from here. And the whole
              // inventory again every minute, because a log client that
              // connects after boot would otherwise see none of it.
              static uint32_t logged[256] = {0};
              static uint32_t round_start = 0;
              if (millis() - round_start > 60000) {
                round_start = millis();
                for (auto &k : logged) k = 0;
              }
              uint8_t a = can_id & 0xFF;
              uint8_t dt = x[3];
              uint16_t fn = (x[4] << 8) | x[5];
              uint8_t inst = x[6] & 0x0F;
              uint32_t k = ((uint32_t) dt << 24) | ((uint32_t) fn << 8) | inst;
              if (logged[a] == k) return;
              logged[a] = k;

              const char *dts = "UNKNOWN";
              switch (dt) {
                case 3:  dts = "LATCHING_RELAY"; break;
                case 10: dts = "TANK_SENSOR"; break;
                case 13: dts = "RGB_LIGHT"; break;
                case 20: dts = "DIMMABLE_LIGHT"; break;
                case 24: dts = "GENERATOR_GENIE"; break;
                case 30: dts = "LATCHING_RELAY_TYPE_2"; break;
                case 33: dts = "MOMENTARY_H_BRIDGE_TYPE_2"; break;
                case 36: dts = "BLUETOOTH_GATEWAY"; break;
                case 39: dts = "CHASSIS_INFO"; break;
                case 40: dts = "LEVELER_TYPE_4"; break;
                case 47: dts = "AWNING_SENSOR"; break;
                default: break;
              }

              const char *fns = "UNKNOWN";
              switch (fn) {
                case 5:   fns = "WATER_PUMP"; break;
                case 34:  fns = "KITCHEN_PENDANTS_LIGHT"; break;
                case 49:  fns = "AWNING_LIGHT"; break;
                case 67:  fns = "FRESH_TANK"; break;
                case 68:  fns = "GREY_TANK"; break;
                case 69:  fns = "BLACK_TANK"; break;
                case 96:  fns = "SLIDE"; break;
                case 105: fns = "AWNING"; break;
                case 106: fns = "LEVEL_UP_LEVELER"; break;
                case 270: fns = "TANK_HEATER"; break;
                case 366: fns = "SOFFIT_LIGHT"; break;
                default: break;
              }

              // Unknown values print their number so you can look them up or
              // report them. A name we do not have is still a device you own.
              // The tail is what goes in a device file's vars. The address is
              // only for reading the log: it will not survive a power cut.
              if (dt > 0 && fn > 0) {
                ESP_LOGI("oc.discover",
                         "node 0x%02X  %s(%u)  %s(%u)  instance %u  ->  dev_func: %u, dev_inst: %u",
                         (unsigned) a, dts, (unsigned) dt, fns, (unsigned) fn,
                         (unsigned) inst, (unsigned) fn, (unsigned) inst);
              }
