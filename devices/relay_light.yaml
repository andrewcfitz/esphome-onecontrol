# One OneControl light on a latching relay. Include once per fixture.
#
#   vars: dev_id    ESPHome id prefix, e.g. hutch
#         dev_name  Home Assistant name, e.g. Hutch
#         dev_func  the node's FUNCTION_NAME number
#         dev_inst  its function instance
#         dev_icon  mdi icon
#
# Take dev_func and dev_inst from discover.yaml, which prints both. They are
# what the node says it is, and unlike its address they survive a power cut.
#
# Binds only to LATCHING_RELAY or LATCHING_RELAY_TYPE_2. That restriction is
# the safety: a MOMENTARY_H_BRIDGE_TYPE_2 or MOMENTARY_RELAY_TYPE_2 node derives
# from the relay class and accepts the identical command frame, an empty payload
# with the command in the message data byte of the ID. Sent to one of those, it
# does not fail, it drives a slide or an awning.
#
# A DIMMABLE_LIGHT whose fixture strobes when dimmed does not belong here, and
# would never bind here. Use dimmable_light_switched.yaml.
substitutions:
  dev_id: unset
  dev_name: unset
  dev_func: unset
  dev_inst: unset
  dev_icon: "mdi:lightbulb"

globals:
  # Current address: -1 while unbound, -2 while ambiguous. Neither matches a
  # real frame, so an unbound device hears nothing and sends nothing.
  - id: ${dev_id}_addr
    type: int
    restore_value: no
    initial_value: '-1'

# Find this node by what it is, not where it was. Only a LATCHING_RELAY or
# LATCHING_RELAY_TYPE_2 can match, so this file cannot bind to a motor node
# however the vars are written.
interval:
  - interval: 1s
    then:
      - lambda: |-
          id(oc_bind)("${dev_name}", (1ull << 3) | (1ull << 30), ${dev_func}, ${dev_inst},
                      id(${dev_id}_addr));

light:
  # NOT optimistic: state comes from what the node reports, so a rejected
  # command springs the entity back within a second instead of lying.
  #
  # restore_mode: ALWAYS_OFF is a formality, not a restore. It is simply what
  # the entity holds for its first second, before its node speaks. The output
  # is inert for 10s anyway, so it never reaches the wire.
  - platform: binary
    id: ${dev_id}_light
    name: ${dev_name}
    icon: ${dev_icon}
    output: ${dev_id}_out
    restore_mode: ALWAYS_OFF

output:
  # The transmit half. Both guards matter: light_ready blocks the write
  # ESPHome performs at boot, light_sync blocks the write caused by pushing
  # bus state into the entity.
  - platform: template
    id: ${dev_id}_out
    type: binary
    write_action:
      - lambda: |-
          if (!id(light_ready) || id(light_sync)) return;
          int a = id(${dev_id}_addr);
          if (a < 0) {
            ESP_LOGW("oc", "${dev_name}: no node bound, command not sent");
            return;
          }
          id(light_cmd)->execute(a, (int) id(oc_key)[a], state, false, 100);

binary_sensor:
  # The ground truth, and what makes the light entity honest rather than
  # optimistic. on_state pushes the node's real state into the light, so a
  # wall switch or the phone app moves Home Assistant too.
  #
  # No lambda and no initial value, so it reads "unknown" until the node
  # speaks. That is honest: we do not know yet.
  - platform: template
    id: ${dev_id}_state
    name: ${dev_name} State
    device_class: light
    entity_category: diagnostic
    on_state:
      - lambda: |-
          if (id(${dev_id}_light).remote_values.is_on() == x) return;
          id(light_sync) = true;
          auto c = x ? id(${dev_id}_light).turn_on() : id(${dev_id}_light).turn_off();
          c.perform();
          id(light_sync) = false;

canbus:
  - id: !extend can_bus
    on_frame:
      # ---- This node's 1 Hz DEVICE_STATUS -------------------------------
      # Relay payload: [0] low nibble = output state (1 = on), bit 5 = fault
      # latch. Self-healing: a dropped frame costs a second, where a missed
      # command would otherwise leave Home Assistant lying indefinitely.
      - can_id: 0x300
        can_id_mask: 0x700
        use_extended_id: false
        then:
          - lambda: |-
              if ((can_id & 0xFF) != id(${dev_id}_addr)) return;
              if (x.empty()) return;
              id(${dev_id}_state).publish_state((x[0] & 0x0F) == 1);

      # ---- Somebody else commanding this node ---------------------------
      # Catches the phone app and wall keypads, so Home Assistant follows
      # within milliseconds instead of waiting for the next 1 Hz report.
      # Message data is deliberately NOT matched in the filter: dimmable
      # lights leave it at 0 and put the command in the payload, relays do the
      # exact reverse. Pinning it to 0 would miss every relay command.
      - can_id: 0x00020000
        can_id_mask: 0x00030000
        use_extended_id: true
        then:
          - lambda: |-
              if (((can_id >> 8) & 0xFF) != id(${dev_id}_addr)) return;
              id(${dev_id}_state).publish_state((can_id & 0xFF) == 1);
