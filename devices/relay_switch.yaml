# One OneControl latching relay as a switch: water pump, tank heater, and
# anything else that is not a light.
#
#   vars: dev_id / dev_name / dev_func / dev_inst / dev_icon, as relay_light.yaml
#         dev_class  Home Assistant device_class for the state sensor,
#                    e.g. running for a pump, heat for a heater
#
# Binds only to LATCHING_RELAY or LATCHING_RELAY_TYPE_2, never to a
# MOMENTARY_H_BRIDGE_TYPE_2 or MOMENTARY_RELAY_TYPE_2. Those classes derive from
# the relay class and accept the identical command frame: an empty payload with
# the command in the message data byte of the ID. Sent to one of those, it does
# not fail, it drives a slide or an awning.
substitutions:
  dev_id: unset
  dev_name: unset
  dev_func: unset
  dev_inst: unset
  dev_icon: "mdi:toggle-switch"
  dev_class: running

globals:
  # Current address: -1 while unbound, -2 while ambiguous. Neither matches a
  # real frame, so an unbound device hears nothing and sends nothing.
  - id: ${dev_id}_addr
    type: int
    restore_value: no
    initial_value: '-1'

# Find this node by what it is, not where it was. Only a LATCHING_RELAY or
# LATCHING_RELAY_TYPE_2 can match, so this file cannot bind to a motor node
# however the vars are written.
interval:
  - interval: 1s
    then:
      - lambda: |-
          id(oc_bind)("${dev_name}", (1ull << 3) | (1ull << 30), ${dev_func}, ${dev_inst},
                      id(${dev_id}_addr));

switch:
  - platform: template
    id: ${dev_id}
    name: ${dev_name}
    icon: ${dev_icon}
    # {} rather than false while the node has not reported: a binary_sensor
    # with no state reads as false, which would claim the pump is off before
    # the node has said anything. That is a guess dressed up as a reading.
    lambda: |-
      if (!id(${dev_id}_state).has_state()) return {};
      return id(${dev_id}_state).state;
    turn_on_action:
      - lambda: |-
          int a = id(${dev_id}_addr);
          if (a < 0) {
            ESP_LOGW("oc", "${dev_name}: no node bound, command not sent");
            return;
          }
          id(light_cmd)->execute(a, (int) id(oc_key)[a], true, false, 100);
    turn_off_action:
      - lambda: |-
          int a = id(${dev_id}_addr);
          if (a < 0) {
            ESP_LOGW("oc", "${dev_name}: no node bound, command not sent");
            return;
          }
          id(light_cmd)->execute(a, (int) id(oc_key)[a], false, false, 100);

binary_sensor:
  - platform: template
    id: ${dev_id}_state
    name: ${dev_name} State
    device_class: ${dev_class}
    entity_category: diagnostic

canbus:
  - id: !extend can_bus
    on_frame:
      - can_id: 0x300
        can_id_mask: 0x700
        use_extended_id: false
        then:
          - lambda: |-
              if ((can_id & 0xFF) != id(${dev_id}_addr)) return;
              if (x.empty()) return;
              id(${dev_id}_state).publish_state((x[0] & 0x0F) == 1);

      - can_id: 0x00020000
        can_id_mask: 0x00030000
        use_extended_id: true
        then:
          - lambda: |-
              if (((can_id >> 8) & 0xFF) != id(${dev_id}_addr)) return;
              id(${dev_id}_state).publish_state((can_id & 0xFF) == 1);
